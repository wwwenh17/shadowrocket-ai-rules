name: Validate Shadowrocket configuration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static validation
        run: |
          python scripts/build_providers.py
          python scripts/validate.py

      - name: Mihomo YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file("templates/config-template.yaml"); Dir["providers/*.yaml"].each { |f| YAML.load_file(f) }'

      - name: Offline node classification fixture
        run: |
          python scripts/proxy_provider_analysis.py tests/fixtures/proxies.yaml --output /tmp/node-classification.yaml
          grep -q 'region: UNKNOWN' /tmp/node-classification.yaml

      - name: Check upstream rule URLs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t urls < <(awk -F, '$1 == "RULE-SET" { print $2 }' shadowrocket-ai.conf | sort -u)
          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 30 \
              --range 0-2047 "${url}" >/dev/null
          done

      - name: Check LOWERTOP reference compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            --output /tmp/lazy_group.conf \
            https://lowertop.github.io/Shadowrocket/lazy_group.conf
          python scripts/validate.py --lowertop-reference /tmp/lazy_group.conf
