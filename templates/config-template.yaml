# Mihomo / OpenClash template. Replace the example.invalid URL locally; never commit a subscription URL or token.
mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning

proxy-providers:
  subscription:
    type: http
    url: "https://example.invalid/replace-with-your-subscription"
    path: ./providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

proxy-groups:
  - name: 🚀节点选择
    type: select
    use: [subscription]
    proxies: [♻️自动选择, 🛑故障转移, 🇺🇸 US, 🇯🇵 JP, 🇭🇰 HK, 🇸🇬 SG, DIRECT]
  - name: ♻️自动选择
    type: url-test
    use: [subscription]
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    filter: '^(?!.*(?:剩余|到期|流量|套餐|官网|客服|公告|群组|频道|重置|游戏|GAME)).*$'
  - name: 🛑故障转移
    type: fallback
    use: [subscription]
    url: https://www.gstatic.com/generate_204
    interval: 600
    filter: '^(?!.*(?:剩余|到期|流量|套餐|官网|客服|公告|群组|频道|重置|游戏|GAME)).*$'
  - name: 🇺🇸 US
    type: url-test
    use: [subscription]
    url: https://www.gstatic.com/generate_204
    interval: 600
    filter: '(?i)(🇺🇸|美国|美國|\\bUS\\b|\\bUSA\\b|United States|America|Los Angeles|San Jose|Seattle|New York|Dallas|洛杉矶|洛杉磯|圣何塞|聖荷西|西雅图|西雅圖|纽约|紐約|达拉斯)'
  - name: 🇯🇵 JP
    type: url-test
    use: [subscription]
    url: https://www.gstatic.com/generate_204
    interval: 600
    filter: '(?i)(🇯🇵|日本|\\bJP\\b|Japan|Tokyo|Osaka|东京|東京|大阪|埼玉)'
  - name: 🇭🇰 HK
    type: url-test
    use: [subscription]
    url: https://www.gstatic.com/generate_204
    interval: 600
    filter: '(?i)(🇭🇰|香港|\\bHK\\b|Hong Kong|HKG)'
  - name: 🇸🇬 SG
    type: url-test
    use: [subscription]
    url: https://www.gstatic.com/generate_204
    interval: 600
    filter: '(?i)(🇸🇬|新加坡|狮城|獅城|\\bSG\\b|Singapore)'
  - name: 🤖 AI
    type: select
    proxies: [🇺🇸 US, 🇯🇵 JP, 🇭🇰 HK, 🚀节点选择]
  - name: 🌐 Google
    type: select
    proxies: [🇺🇸 US, 🚀节点选择, 🇯🇵 JP, 🇭🇰 HK]
  - name: 📺 YouTube
    type: select
    proxies: [🇯🇵 JP, 🇺🇸 US, 🇭🇰 HK, 🚀节点选择]
  - name: 🐱 GitHub
    type: select
    proxies: [🇺🇸 US, 🚀节点选择, 🇯🇵 JP]
  - name: 👨‍💻 Developer
    type: select
    proxies: [🇺🇸 US, 🚀节点选择, 🇯🇵 JP]
  - name: 🎬 Netflix
    type: select
    proxies: [🇯🇵 JP, 🇭🇰 HK, 🇺🇸 US, 🚀节点选择]
  - name: 🎵 Spotify
    type: select
    proxies: [DIRECT, 🚀节点选择, 🇯🇵 JP, 🇺🇸 US]
  - name: 🇯🇵 Japan-Media
    type: select
    proxies: [🇯🇵 JP, 🚀节点选择]
  - name: 🍎 Apple
    type: select
    proxies: [DIRECT, 🚀节点选择]
  - name: 💰 Finance
    type: select
    proxies: [DIRECT, 🚀节点选择]
  - name: 💳 Payment
    type: select
    proxies: [DIRECT, 🚀节点选择]
  - name: 🚫 Advertising
    type: select
    proxies: [REJECT, DIRECT]

rule-providers:
